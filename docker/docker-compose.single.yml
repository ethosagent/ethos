# Single-service "just talk to it" profile (W1.4, zero-friction-first-hour).
#
# One service, ETHOS_MODE=all (web UI + gateway under one supervisor), two
# volumes — state and the agent's working directory. Put an API key in .env
# next to this file, then:
#
#   docker compose -f docker-compose.single.yml up
#
# Web UI: http://localhost:3000 — the entrypoint runs `ethos setup --from-env`
# (ETHOS_PROVISION_FROM_ENV=1) at boot, so config lands in the volume before the
# web UI serves and the SPA opens DIRECTLY in chat — never re-asking for the key
# already in .env. config.yaml is written once; secrets re-sync every boot.
# The post-publish CI smoke gate (.github/workflows/docker-publish.yml)
# targets exactly this file. The three-service operator topology lives in
# docker-compose.yml.
#
# ETHOS_IMAGE pins a specific published tag (the smoke gate sets it to the
# just-published version). ETHOS_DATA_DIR swaps the `ethos-data` state volume
# for a host directory, ETHOS_WORKSPACE_DIR relocates the working directory.

services:
  ethos:
    image: ${ETHOS_IMAGE:-ethosagent/ethos:latest}
    env_file:
      - path: ./.env
        required: false
    environment:
      ETHOS_MODE: all
      ETHOS_WEB_HOST: 0.0.0.0
      ETHOS_PROVISION_FROM_ENV: "1"
      ETHOS_SKIP_VALIDATION:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      OPENROUTER_API_KEY:
      OPENROUTER_MODEL:
      GOOGLE_API_KEY:
      AZURE_API_KEY:
      AZURE_ENDPOINT:
      AZURE_MODEL:
      AZURE_API_VERSION:
      TELEGRAM_BOT_TOKEN:
      TELEGRAM_OWNER_ID:
    ports:
      - "3000:3000"
    # read_only: true makes only the container's ROOT filesystem read-only —
    # bind mounts stay writable. The workspace mount is what makes the agent's
    # default fs_reach on cwd (process.cwd()) behave the same in a container as
    # it does from a local terminal: writable and persistent across restarts.
    working_dir: /home/ethos/workspace
    volumes:
      # State lives in the named volume `ethos-data` by default. To use a host
      # directory instead, set ETHOS_DATA_DIR to its path (e.g. ./ethos-data).
      # Not on Docker Desktop: its bind mounts are virtiofs/gRPC-FUSE (macOS)
      # or 9p (Windows), where SQLite locking is unsafe — `ethos doctor` warns.
      - ${ETHOS_DATA_DIR:-ethos-data}:/home/ethos/.ethos
      - ${ETHOS_WORKSPACE_DIR:-./ethos-workspace}:/home/ethos/workspace
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  ethos-data:
    name: ethos-data
