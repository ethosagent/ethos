# lefthook config — pre-commit + pre-push hooks for ethos.
#
# Why lefthook (not Husky / pre-commit): single Go binary, no Node-dep
# loop, fast cold-start. Installed automatically by `make prepare`.
#
# Disable hooks for a single command with the LEFTHOOK=0 env var.

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: '*.{ts,tsx,js,jsx,json}'
      run: pnpm dlx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Architecture rules (architecture.config.ts), scoped to the changed files. `--changed` with
    # no value asks git for staged, unstaged and untracked files; the glob only decides whether
    # the command runs at all. `verdict` prints one blocking answer.
    archcheck:
      glob: '*.{ts,tsx}'
      run: pnpm exec archcheck --changed --format verdict

    eof-newline:
      glob: '*'
      run: |
        set -e
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if [ -n "$(tail -c 1 "$f" 2>/dev/null)" ]; then
            printf '\n' >> "$f"
          fi
        done
      stage_fixed: true

pre-push:
  commands:
    typecheck-fast:
      run: pnpm typecheck
    # The whole-repository archcheck run (exit 1 new violation, 2 manifest broken, 4 run
    # `pnpm exec archcheck baseline --prune`), then the rule that .archcheck/baseline.json only
    # shrinks unless a commit carries `Architecture-Approved-By:`.
    archcheck:
      run: pnpm exec archcheck
    # The generated rule table in ARCHITECTURE.md and .archcheck/generated/ match the manifest
    # (exit 3 → run `pnpm arch:emit` and commit the result).
    archcheck-emit:
      run: pnpm exec archcheck emit --check
    archcheck-baseline-shrinks:
      run: node scripts/check-archcheck-baseline.mjs
    # Law 7's tool-package half: no direct node:fs / node:child_process imports in
    # extensions/tools-*/src (archcheck cannot ban a Node built-in import).
    tool-imports:
      run: bash scripts/check-tool-imports.sh
