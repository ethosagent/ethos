      - packages/core/src/agent-loop/stages/context-assembly.ts
      - packages/core/src/agent-loop/stages/per-call-enforcement.ts
      - packages/core/src/agent-loop/stages/tool-processing.ts
      - packages/core/src/agent-loop/stages/tool-rejection.ts
      - packages/core/src/agent-loop/result-defense.ts
      - packages/core/src/scoped/scoped-fs.ts
      - packages/core/src/scoped/scoped-fetch.ts
      - packages/core/src/scoped/scoped-process.ts
      - packages/core/src/scoped/scoped-secrets.ts
      - packages/core/src/scoped/scoped-attachments.ts
      - packages/core/src/fs-reach.ts
      - packages/core/src/path-boundary.ts
      - packages/core/src/url-validator.ts
      - packages/core/src/capability-validator.ts
      - packages/core/src/capability-resolver.ts
      - packages/core/src/hook-registry.ts
      - packages/core/src/script-safe.ts
    # NOT kernel, deliberately:
    #   sanitize-output.ts — `stripAnsiEscapes` is a pure string utility with no
    #     chokepoint. Every caller opts in (apps/ethos render paths,
    #     extensions/gateway, extensions/tools-code), so nothing in the kernel
