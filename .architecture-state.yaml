# ---- Security tiers -------------------------------------------------------
# Every workspace package under packages/, packages/safety/, extensions/, and
# apps/ carries a tier. 149 packages: 11 at Tier 0, 27 at Tier 1, 111 at Tier 2.
#
# The tier bounds what we promise to be CORRECT, not what we promise to LOOK
# AT. Triage reads the guarantee register first and the tier second — a Tier 2
# finding that defeats a published Tier 0 guarantee is a Tier 0 finding, and
# the fix belongs in the kernel rather than at the reporting site. The contract
# per tier is in docs/content/security/security-boundary.md; the four triage
# verdicts are in SECURITY.md.
#
# The workspace also includes `docs`, `examples/*` and `plugins/*`
# (pnpm-workspace.yaml). None of them is in `TIERED_ROOTS`
# (scripts/check-architecture.mjs), so none carries a tier.
#
# `docs` and `examples/*` ship no runtime code into an agent process. A plugin
# under `plugins/*` does, but only once an operator installs it into
# `~/.ethos/plugins` or a project `.ethos/plugins`: `PluginLoader` then
# `import()`s its entry module directly into the host process, where it shares
# the process, the environment, the filesystem and the API keys. The capability
# grant recorded at install time is a consent record, not a containment
# boundary — see the header of extensions/plugin-loader/src/grants.ts. Sitting
# in this repo grants a plugin nothing extra; it is loaded on exactly the same
# terms as one fetched from anywhere else.

tiers:
  # ---------------------------------------------------------------------------
  # Tier 0 — security kernel (the TCB). Guaranteed, CVE-eligible, no §VIII
  # exception path. A Tier 2 extension must not be able to weaken a Tier 0
  # guarantee. Roster and rationale: docs/content/security/security-boundary.md
  # ---------------------------------------------------------------------------

  packages/core:
    package: "@ethosagent/core"
    tier: 0
    assigned: 2026-08-12
