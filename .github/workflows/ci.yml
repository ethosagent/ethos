name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt the runner-side Node into 24 for actions; suppresses Node 20 deprecation warning.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    # The suite takes 7–10 min on GitHub runners, so 10 cancelled green runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bash scripts/check-tests.sh

  integration:
    name: integration
    runs-on: ubuntu-latest
    # The tier runs in ~20s locally; three real gateway boots under tsx on a
    # cold runner are the long pole, so leave generous headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bash scripts/check-integration.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on every PR — the gate is cheap and the rules drift fast. Locally
    # the same script runs via `pnpm docs:check`. Pre-build it once so the
    # JSON-LD parse check can read built HTML.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build the docs site
        run: pnpm --filter docs run build
      - name: Run docs:check page-acceptance gate
        run: bash scripts/check-docs.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bash scripts/check-typecheck.sh

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    # A cold archcheck run over the repository is ~35s; the rest is setup.
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline-shrink check reads .archcheck/baseline.json at the base commit and walks
          # the commits since it for an Architecture-Approved-By trailer.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Run once, capture the exit code, and upload the SARIF whatever it was, so a failing run
      # still annotates the PR. The job fails on the code in the last step.
      - name: Run archcheck (SARIF)
        id: archcheck
        run: |
          set +e
          pnpm exec archcheck --format sarif > archcheck.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: archcheck.sarif
          category: archcheck
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### archcheck coverage'
            echo '```'
            pnpm exec archcheck coverage
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 3 → the generated rule table / .archcheck/generated/ is stale: run `pnpm arch:emit`
      - name: Emitted output is up to date
        run: pnpm exec archcheck emit --check
      - name: The archcheck baseline only shrinks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-archcheck-baseline.mjs --base "$BASE_SHA"
      # Law 7's tool-package half: no direct node:fs / node:child_process imports in
      # extensions/tools-*/src (archcheck cannot ban a Node built-in import).
      - name: Tool packages use ctx, not node:fs / node:child_process
        run: bash scripts/check-tool-imports.sh
      # 1 new violation · 2 manifest/environment broken · 4 run `pnpm exec archcheck baseline --prune`
      - name: Fail on archcheck findings
        if: steps.archcheck.outputs.exit_code != '0'
        run: |
          echo "::error::archcheck exited ${{ steps.archcheck.outputs.exit_code }} — run \`pnpm arch\` locally for the readable report"
          exit 1

  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # version-sync's --pr mode is only meaningful in PR context
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bash scripts/check-version-sync.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run Biome (advisory — never blocks merge)
        id: lint
        run: |
          set +e
          bash scripts/check-lint.sh > lint.out 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat lint.out
          # Always succeed: lint is advisory at the workflow level
          exit 0
      # Sticky comment — find by hidden HTML marker, update in place if it
      # exists so long-lived PRs don't accumulate one comment per push.
      # When lint goes green, the body becomes "✓ Lint clean" (still sticky)
      # so the stale findings don't linger after they're fixed.
      - name: Sticky lint comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ethos-ci-lint-comment -->';
            const exitCode = '${{ steps.lint.outputs.exit_code }}';
            let body;
            if (exitCode === '0') {
              body = `${MARKER}\n### ✓ Lint clean (advisory)\n\nNo Biome findings on this PR's snapshot.`;
            } else {
              const raw = fs.readFileSync('lint.out', 'utf8');
              const trimmed = raw.length > 30000 ? raw.slice(0, 30000) + '\n…(truncated)' : raw;
              body = `${MARKER}\n### Lint findings (advisory — does not block merge)\n\`\`\`\n${trimmed}\n\`\`\``;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run security audit
        run: pnpm audit --audit-level=high || true
      - name: Check for hardcoded secrets
        run: |
          # Simple grep-based secret detection
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.ts" --include="*.js" --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null | grep -v "test" | grep -v "__tests__" | grep -v "example" | grep -v "\.md"; then
            echo "::error::Potential hardcoded API key detected"
            exit 1
          fi
