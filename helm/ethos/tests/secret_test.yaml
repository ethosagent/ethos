# R7 branches covered here: 9 (secret: rendered with stringData when inline
# secrets are set and existingSecret is empty; absent when existingSecret is
# set even with secrets non-empty; absent when both are empty — the envFrom
# side of branch 9 is asserted in statefulset_test.yaml).
suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: renders a Secret with stringData when inline secrets are set and no existingSecret
    set:
      secrets:
        ANTHROPIC_API_KEY: sk-ant-test
        TELEGRAM_BOT_TOKEN: "12345:abc"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ethos
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.ANTHROPIC_API_KEY
          value: sk-ant-test
      - equal:
          path: stringData.TELEGRAM_BOT_TOKEN
          value: "12345:abc"

  - it: renders no Secret when existingSecret is named, even with inline secrets set (plan D6)
    set:
      existingSecret: my-keys
      secrets:
        ANTHROPIC_API_KEY: sk-ant-test
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret when neither existingSecret nor secrets is set
    asserts:
      - hasDocuments:
          count: 0
