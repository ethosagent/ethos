# R7 branches covered here: 10 (serviceaccount: rendered with
# automountServiceAccountToken false + annotations passthrough; absent when
# create=false — the statefulset's serviceAccountName behaviour for that case
# is asserted in statefulset_test.yaml).
suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders a ServiceAccount by default with the API token mount disabled (plan D14)
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ethos
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: passes workload-identity annotations through
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ethos
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/ethos

  - it: renders no ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
