{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ethos.serviceAccountName" . }}
  labels:
    {{- include "ethos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Ethos never calls the Kubernetes API; the account exists only as the
# anchor for workload-identity annotations (plan D14).
automountServiceAccountToken: false
{{- end }}
